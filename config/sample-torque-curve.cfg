# Sample configuration for dynamic acceleration based on stepper motor
# torque-speed curves.
#
# This feature allows the printer to automatically limit acceleration based
# on the current move speed, accounting for the fact that stepper motors
# lose torque as speed increases (pullout torque curve).
#
# There are two components:
# 1. torque_curve - Loads and applies a speed/acceleration lookup table
# 2. torque_curve_calibrate - Automated calibration to generate the curve

# ==============================================================================
# TORQUE CURVE - Speed-based acceleration limiting
# ==============================================================================
# This module loads a CSV file containing speed vs max acceleration data
# and automatically limits acceleration during moves based on the target speed.

[torque_curve my_curve]
# Path to CSV file with torque curve data (speed, max_accel columns)
# Can be absolute path or relative to config directory
curve_file: torque_curve.csv

# Interpolation method between data points:
# - linear: Smooth interpolation (recommended)
# - step: Use lower point's value (more conservative)
interpolation: linear

# Safety margin multiplier (0.1 to 1.0)
# Applied to looked-up acceleration values
# 0.9 = use 90% of measured max acceleration
safety_margin: 0.9

# Fallback acceleration when curve is not loaded or speed is out of range
#fallback_max_accel: 5000

# Enable/disable the dynamic limiting (default: true)
enabled: true


# ==============================================================================
# TORQUE CURVE CALIBRATION - Automated curve generation
# ==============================================================================
# This module provides an automated test harness to generate the torque curve
# by testing increasing accelerations at various speeds until step loss is
# detected.
#
# WARNING: This test intentionally pushes the motors until they skip steps.
# Use with caution and ensure the printer can safely handle potential skipping.

[torque_curve_calibrate my_calibration]
# Axis to test (x or y)
axis: x

# Speed range to test (mm/s)
speed_start: 50
speed_end: 300
speed_step: 25

# Acceleration range to test (mm/s^2)
accel_start: 1000
accel_max: 50000
accel_step: 500

# Distance for test moves (mm)
# Should be long enough to reach target speed
test_move_distance: 50

# Position tolerance for detecting lost steps (mm)
# Smaller values are more sensitive but may cause false positives
position_tolerance: 0.1

# Output file for calibration results
output_file: torque_curve.csv

# Optional: Name of torque_curve module to update with results
target_curve: my_curve

# --- Vibration instrumentation + input shaping (optional) ---------------------
# When measure_vibration is on, the sweep captures the accelerometer during each
# probe, subtracts the commanded acceleration, and builds a resonance spectrum
# from the residual ringing of the real test moves. At the end it runs Klipper's
# own shaper fitter and writes a standard resonances CSV + a SHAPER_CALIBRATE-
# style PNG -- an input-shaper recommendation derived from real moves rather than
# the canonical pulse sweep. Outputs land under end_game/{torque_curve,
# input_shaping}/ next to your config.
#measure_vibration: False
#accel_chip: lis2dw
#    Accelerometer to use (e.g. lis2dw / adxl345). Auto-detected if omitted.
#vibration_shaper_off: False
#    Disable input shaping during the sweep to capture the raw, unshaped modes
#    (default measures with shaping ON, i.e. real-world shaped vibration).
#ring_down_time: 0.15
#    Stationary window (s) captured right after each burst -- commanded accel is
#    zero there, so it's the pure decaying resonance. 0 disables.
#baseline_time: 0.25
#    Stationary noise-floor window (s) captured once before the sweep; every
#    metric is quadrature-subtracted against it.
#apply_shaper: False
#    Apply the recommended shaper live (SET_INPUT_SHAPER) and stage it into
#    SAVE_CONFIG. Off by default so a sweep never silently changes motion; set
#    per-run with APPLY_SHAPER=1. Applying it also re-derives auto_jerk (which
#    reads the input_shaper frequency) from this measured resonance.


# ==============================================================================
# EXAMPLE CSV FILE FORMAT
# ==============================================================================
# The torque curve CSV file should have two columns: speed and max_accel
# Lines starting with # are comments
# First non-comment line can be a header (will be skipped if non-numeric)
#
# Example torque_curve.csv:
# -------------------------
# # Torque curve for TMC2209 at 24V, 1.5A RMS
# # Generated by TORQUE_CURVE_CALIBRATE
# speed,max_accel
# 0,15000
# 50,14000
# 100,12000
# 150,9000
# 200,6000
# 250,4000
# 300,2500
# -------------------------


# ==============================================================================
# GCODE COMMANDS
# ==============================================================================
#
# TORQUE_CURVE_LOAD NAME=my_curve [FILE=<path>]
#   Load or reload a torque curve from a CSV file
#
# TORQUE_CURVE_STATUS NAME=my_curve
#   Show current status and sample lookup values
#
# TORQUE_CURVE_SET NAME=my_curve [ENABLE=0|1] [SAFETY_MARGIN=<0.1-1.0>]
#                                [INTERPOLATION=linear|step]
#   Modify torque curve settings at runtime
#
# TORQUE_CURVE_CALIBRATE NAME=my_calibration
#                        [SPEED_START=<mm/s>] [SPEED_END=<mm/s>]
#                        [SPEED_STEP=<mm/s>] [ACCEL_START=<mm/s^2>]
#                        [ACCEL_MAX=<mm/s^2>] [ACCEL_STEP=<mm/s^2>]
#                        [ACCEL_GROWTH=<x>] [TEST_CYCLES=<n>] [OUTPUT_FILE=<path>]
#                        [MEASURE_VIBRATION=0|1] [VIBRATION_SHAPER_OFF=0|1]
#                        [RING_DOWN_TIME=<s>] [BASELINE_TIME=<s>]
#                        [APPLY_SHAPER=0|1] [RESUME=0|1]
#   Run automated calibration (homes axis, tests accelerations). With
#   MEASURE_VIBRATION=1 it also writes the resonance spectrum + shaper graph;
#   APPLY_SHAPER=1 applies the recommended shaper and stages SAVE_CONFIG.
#   Each completed speed is checkpointed to end_game/torque_curve/
#   <stem>_<axis>_progress.csv (+ a _psd.npz for the shaper spectrum). If a
#   sweep is interrupted (e.g. accelerometer unplug -> MCU shutdown), recover
#   with FIRMWARE_RESTART and re-run the SAME command with RESUME=1: completed
#   speeds are reused from the checkpoint and only the rest are run, so an
#   interruption costs one speed, not the whole sweep.
#
# TORQUE_CURVE_CALIBRATE_ABORT NAME=my_calibration
#   Abort a running calibration


# ==============================================================================
# USAGE NOTES
# ==============================================================================
#
# MOTION MODES:
#    A successful calibration also writes end_game/motion_modes.cfg with four
#    switchable gcode_macros that layer the calibrated knobs (TOPP-RA torque
#    curve, input shaper, jerk limiting) into profiles:
#      BATSHIT_BENCHY - bare TOPP-RA + corner rounding, no shaping; near edge
#      OG             - shaped, no jerk smoothing
#      ENDGAME        - shaped + auto jerk; the smooth daily driver
#      QUIET          - shaped + gentle jerk; tall/delicate prints
#    Each mode's SAFETY_MARGIN is a fraction of the MEASURED skip boundary
#    (Speed derived from how crisply the skip edge was located). Include the
#    file and call a macro any time or from PRINT_START. Edit the margins/
#    offsets in the file to taste.
#
# 1. CALIBRATION WORKFLOW:
#    a. Add [torque_curve_calibrate] section to your config
#    b. Run: TORQUE_CURVE_CALIBRATE NAME=my_calibration
#    c. Wait for calibration to complete (may take 10-30 minutes)
#    d. Add [torque_curve] section pointing to generated CSV
#    e. Restart firmware
#
# 2. MANUAL CURVE CREATION:
#    If you know your motor's torque curve from datasheets, you can
#    create the CSV manually. Convert RPM to mm/s using:
#    speed_mm_s = (RPM / 60) * (microsteps * steps_per_mm)
#
# 3. MULTIPLE AXES:
#    You can create separate torque curves for X and Y axes if they
#    have different motors or loads. The calibration module tests
#    one axis at a time.
#
# 4. INTERACTION WITH OTHER LIMITS:
#    The torque curve limit is applied after kinematics checks and
#    extruder checks. The final acceleration will be the minimum of:
#    - Configured max_accel
#    - Kinematics limits (e.g., max_z_accel)
#    - Torque curve limit
#    - Extruder limits
