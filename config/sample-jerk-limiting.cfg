# Jerk-limited motion (EXPERIMENTAL)
#
# Opt-in layer that smooths Kalico's constant-acceleration motion so that
# acceleration no longer changes instantaneously (infinite jerk) at ramp
# transitions and corners. It is OFF by default and, when disabled, the motion
# pipeline behaves exactly as stock.
#
# This feature is validated by unit tests but has NOT been validated on
# hardware. Enable it at your own risk and start with conservative limits.
#
# Copy this section into your printer.cfg (or include this file) and set
# enabled: True to try it. All three phases can be toggled independently and
# tuned live with SET_JERK_LIMIT.

[jerk_limiting]
enabled: False
#   Master switch. When False (default) this module does nothing.

# --- Phase toggles ---------------------------------------------------------
smooth_ramps: True
#   Phase 1: replace each constant-acceleration ramp with a jerk-limited
#   (S-curve) ramp. This is the core feature; the other phases build on it.
blend_junctions: True
#   Phase 2: across collinear moves that are already accelerating/decelerating
#   at full rate, carry the acceleration through the seam instead of forcing it
#   back to zero at every move boundary. Only takes effect with smooth_ramps.
round_corners: False
#   Phase 3 (most experimental): replace sharp corners with a curvature-
#   continuous cubic B-spline blend kept within corner_max_deviation. Leave
#   False unless you specifically want corner rounding.

# --- Parameters ------------------------------------------------------------
max_jerk: 100000
#   Maximum rate of change of acceleration, in mm/s^3. Lower values give
#   smoother (gentler) motion at the cost of slightly longer moves. A starting
#   point is roughly 20-50x your max_accel.
resolution: 0.002
#   Time step (s) used to discretize each S-curve ramp into constant-accel
#   slices. Smaller is closer to a continuous profile but produces more steps.

# --- Corner rounding (only used when round_corners: True) -------------------
corner_max_deviation: 0.05
#   Maximum distance (mm) the rounded path may deviate from the original sharp
#   corner. Larger rounds corners more aggressively (faster, less accurate).
corner_min_angle: 5.0
#   Corners that turn by less than this angle (degrees) are left unchanged.
corner_blend_ratio: 0.25
#   Maximum fraction of each incident move's length that may be consumed by a
#   corner blend (0.0-0.5).

# Runtime control (no restart needed):
#   SET_JERK_LIMIT ENABLE=1
#   SET_JERK_LIMIT SMOOTH_RAMPS=1 BLEND_JUNCTIONS=1 ROUND_CORNERS=0
#   SET_JERK_LIMIT MAX_JERK=80000 CORNER_MAX_DEVIATION=0.05
#   JERK_LIMIT_STATUS
